# 本地开发 / 集成测试用的 compose 编排
# 生产部署（Fly.io / Render / Railway）走平台原生配置；本文件不作为生产 manifest
#
# 启动：docker compose up --build
# 前端: http://localhost:3000  ·  后端: http://localhost:8080
#
# Postgres / Redis are wired up in production (Fly secrets) but stay opt-in here: local dev defaults to
# SQLite + in-memory cache, and you get the deployed shape by uncommenting the two URLs on the backend.

services:
  backend:
    build: ./backend
    container_name: lgtm-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SQLITE_PATH: /app/data/reviews.db
      # Uncomment to mirror production (Postgres store + Redis cache):
      # POSTGRES_URL: postgres://lgtm:lgtm@postgres:5432/lgtm?sslmode=disable
      # REDIS_URL: redis://redis:6379/0
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lgtm-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  # Local counterpart of the lgtm-pg Fly instance; idle until the backend gets POSTGRES_URL
  postgres:
    image: postgres:16-alpine
    container_name: lgtm-postgres
    environment:
      POSTGRES_USER: lgtm
      POSTGRES_PASSWORD: lgtm
      POSTGRES_DB: lgtm
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgtm -d lgtm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local counterpart of the lgtm-redis Fly instance; backs the cache + rate-limit counters
  redis:
    image: redis:7-alpine
    container_name: lgtm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend-data:
  pg-data:
  redis-data:
