# LGTM backend Fly.io config
# Usage: run `flyctl launch --no-deploy --copy-config` in backend/
# then set secrets (see docs/DEPLOY.md) and run `flyctl deploy`

app = "lgtm-backend"
primary_region = "nrt"  # Tokyo: close to GitHub and to users in China; hkg / sin / sjc etc. also work

# On a stop signal (Fly sends SIGINT; SIGTERM is handled the same) the server drains for SHUTDOWN_TIMEOUT
# before exiting, so this must stay above it. The volume pins us to one machine, so a deploy is down for
# as long as the drain runs: 120s covers a typical review without stalling a deploy for the 300s maximum.
kill_timeout = "120s"

[build]
  dockerfile = "Dockerfile"
  # Note: the real deploy context is the repo root (see .github/workflows/deploy.yml)
  # a manual local `flyctl deploy` has to `cd` to the repo root and pass --config / --dockerfile

# Public entry: automatic HTTPS + force_https; the container listens on 8080
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"     # idle machines beyond min_machines_running stop
  auto_start_machines = true      # start on incoming requests
  # Webhook reviews run after their 202 with no open connection, so an idle-stopped machine kills them mid-review.
  min_machines_running = 1
  processes = ["app"]

  # liveness: the process is alive; every 30s
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "3s"
    path = "/api/health/live"

  # readiness: dependencies are usable; every 10s; a failure pulls it from the LB without a restart
  [[http_service.checks]]
    grace_period = "10s"
    interval = "10s"
    method = "GET"
    timeout = "3s"
    path = "/api/health/ready"

# Volume: holds rag.db, plus reviews.db when no POSTGRES_URL secret is set (survives restart / redeploy)
# Create with: `flyctl volumes create data --size 1 --region nrt`
[mounts]
  source = "data"
  destination = "/data"

# Default env (non-secret; secrets go through `flyctl secrets set ...`)
# The live app also has POSTGRES_URL and REDIS_URL set as secrets, which take priority over SQLITE_PATH
# and the in-memory cache. This file alone does not tell you what production runs — check the secrets.
[env]
  PORT = "8080"
  LLM_PROVIDER = "openai"
  OPENAI_BASE_URL = "https://api.deepseek.com"
  LLM_MODEL = "deepseek-chat"
  SQLITE_PATH = "/data/reviews.db"  # fallback only; the POSTGRES_URL secret wins when present
  # webhook auto-review has no user request to negotiate from, so this is the bot's review language
  DEFAULT_LOCALE = "en"
  ENVIRONMENT = "production"
  # Rate limits key on ClientIP, so it must be the caller's IP and not fly-proxy's.
  # SetTrustedProxies only accepts IPs/CIDRs and the 6PN address fronting us is not
  # a fixed one, so read Fly's own header instead. Fly overwrites it on every inbound
  # request, so it cannot be forged from outside.
  TRUSTED_PLATFORM = "Fly-Client-IP"
  # Leaves 10s of kill_timeout for the process to exit after the drain gives up.
  SHUTDOWN_TIMEOUT = "110s"

  # RAG: rag.db lives on the volume too so the index survives restarts
  # RAG_SCOPE non-empty → the container entrypoint pre-indexes the whole repo under /app/src in the background
  # real recall also needs the EMBEDDING_API_KEY secret; without it this degrades to mock (random vectors, i.e. RAG off)
  RAG_DB_PATH = "/data/rag.db"
  RAG_SCOPE = "ecstasoy/LGTM"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # headroom for LLM calls and a future sqlite-vss
