# Deploys the backend to Fly.io once CI has passed on a push to main; the frontend ships through Vercel's Git integration
#
# Trigger: CI completing on main. A deploy only happens when CI succeeded and the pushed commit touched
#          backend / frontend / docs / .dockerignore / this file — the image bakes in frontend and docs for indexrepo.
#          workflow_dispatch forces a deploy, e.g. to refresh the RAG index without a code change.
#
# Credentials: FLY_API_TOKEN repo secret (`flyctl tokens create deploy -x 90d`)
# Rollback: `flyctl releases rollback v<N>`

name: Deploy backend to Fly.io

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; a later run waits instead of cancelling, so deploys never land out of order
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Fly.io deploy (lgtm-backend)
    # PR runs of CI never deploy, and neither does a red CI on main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI tested, not whatever main points at now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      # workflow_run has no `paths` filter, so diff the pushed commit against its first parent instead
      - name: Check deploy-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(backend/|frontend/|docs/|\.dockerignore$|\.github/workflows/deploy\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No deploy-relevant changes; skipping deploy"
          fi

      - name: Setup flyctl
        if: steps.changes.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be

      - name: Deploy
        if: steps.changes.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --remote-only builds on Fly's builder; the build context is the repo root so the image can copy backend + frontend + docs
        run: |
          flyctl deploy --remote-only \
            --config backend/fly.toml \
            --dockerfile backend/Dockerfile \
            .
